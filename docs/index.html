<!doctype html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-line"><span class="brand-mark"></span>BLUE <span>JACKET</span></div>
        <div class="brand-sub">OPERAÇÃO COMERCIAL · DEMO</div>
      </div>
      <div class="nav-title">Navegação</div>
      <nav class="primary-nav" id="primary-nav" aria-label="Navegação principal"></nav>
      <div class="sidebar-footer">
        <div class="eyebrow">Distribuidor</div>
        <strong>MCD Triunfante Brasil</strong>
        <span>Campo Grande / MS</span>
        <div class="demo-dot"><i></i> Ambiente demonstrativo</div>
      </div>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-button" id="menu-button" aria-label="Abrir navegação"><span></span><span></span></button>

          <div class="breadcrumb" id="breadcrumb">BLUE JACKET / ESTOQUE</div>
          <h1 id="page-title">Estoque</h1>
        </div>
        <div class="top-actions">
          <label class="search"><span>⌕</span><input id="global-search" type="search" placeholder="Buscar no painel…" /></label>

          <button class="icon-button" data-toast="Você está em um protótipo visual"><span>♧</span><i></i></button>

      <section class="subtabs" id="subtabs" aria-label="Navegação da seção"></section>
      <section id="page-content" class="page-content"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>

</html>
